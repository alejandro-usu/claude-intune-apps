name: Build Intune packages

# On push: checks every app, then builds only the apps whose folders changed
# (all apps when tools/ or this workflow changed).
# On demand (Actions tab → Run workflow): builds the named app, or all of them.
on:
  push:
    paths:
      - apps/**
      - tools/**
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      app:
        description: App path under apps/ (e.g. Python/3.15 or PyCharm/2026.2-Python3.15), or "all"
        required: true
        default: all

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install cryptography

      - name: Validate manifests
        run: python tools/build.py --check

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Path apps -Recurse -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) {
              Write-Output "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Choose apps to build
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_APP: ${{ inputs.app }}
          BEFORE: ${{ github.event.before }}
        run: |
          python - <<'EOF'
          import json, os, subprocess, sys
          sys.path.insert(0, "tools")
          import build

          known = build.app_names()
          if os.environ["EVENT"] == "workflow_dispatch":
              wanted = os.environ["INPUT_APP"].strip()
              if wanted == "all":
                  apps = known
              elif wanted in known:
                  apps = [wanted]
              else:
                  sys.exit(f"Unknown app '{wanted}'. Known apps: {', '.join(known)}")
          else:
              before = os.environ.get("BEFORE", "")
              diff = subprocess.run(["git", "diff", "--name-only", before, "HEAD"], capture_output=True, text=True)
              if not before.strip("0") or diff.returncode != 0:
                  apps = known  # new branch or unknown base: build everything
              else:
                  changed = diff.stdout.split()
                  if any(p.startswith(("tools/", ".github/")) for p in changed):
                      apps = known
                  else:
                      # A changed file belongs to the app whose folder contains it.
                      apps = {a for a in known if any(p.startswith(f"apps/{a}/") for p in changed)}
                      # Rebuild apps that depend on a changed app, since their artifact name
                      # includes its version.
                      apps |= {a for a in known if build.load_manifest(a).get("dependsOn") in apps}
                      apps = sorted(apps)
          print("Apps to build:", apps or "none")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"apps={json.dumps(apps)}\n")
          EOF

  build:
    needs: check
    if: needs.check.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.check.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install cryptography

      # Downloads the installers, stops on any SHA-256 mismatch, builds and verifies the package.
      - name: Build ${{ matrix.app }}
        run: python tools/build.py "${{ matrix.app }}"

      - name: Summary
        id: summary
        run: |
          version=$(python -c "import json; print(json.load(open('apps/${{ matrix.app }}/app.json'))['version'])")
          pkg=$(ls out/${{ matrix.app }}/*.intunewin)
          # <Product>-<version>, plus _<Product>-<version> of the app it depends on (tools/build.py).
          artifact=$(python -c "import sys; sys.path.insert(0, 'tools'); import build; app = '${{ matrix.app }}'; print(build.artifact_name(app, build.load_manifest(app)))")
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "package=$pkg" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ matrix.app }} $version"
            echo "- Package: \`$(basename "$pkg")\`, $(stat -c %s "$pkg") bytes"
            echo "- SHA-256: \`$(sha256sum "$pkg" | cut -d' ' -f1)\`"
            echo "- Download the **$artifact** artifact below. GitHub delivers it inside a .zip; extract it before uploading to Intune."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.summary.outputs.artifact }}
          path: ${{ steps.summary.outputs.package }}
          # Packages are encrypted, so compressing them again gains nothing.
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
