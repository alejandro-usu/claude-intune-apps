name: Build Intune packages

# On push: checks every app, then builds only the apps whose folders changed
# (all apps when tools/ or this workflow changed).
# On demand (Actions tab → Run workflow): builds the named app, or all of them.
# On main, it also publishes a GitHub Release for apps with "release": true in app.json, and
# rebuilds the GitHub Pages site (site/) last, so it links to what this run built.
on:
  push:
    paths:
      - apps/**
      - tools/**
      - site/**
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      app:
        description: App path under apps/ (e.g. Python/3.15 or PyCharm/2026.2-Python3.15), or "all"
        required: true
        default: all

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install cryptography

      - name: Validate manifests
        run: python tools/build.py --check

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Path apps -Recurse -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) {
              Write-Output "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Choose apps to build
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_APP: ${{ inputs.app }}
          BEFORE: ${{ github.event.before }}
        run: |
          python - <<'EOF'
          import json, os, subprocess, sys
          sys.path.insert(0, "tools")
          import build

          known = build.app_names()
          if os.environ["EVENT"] == "workflow_dispatch":
              wanted = os.environ["INPUT_APP"].strip()
              if wanted == "all":
                  apps = known
              elif wanted in known:
                  apps = [wanted]
              else:
                  sys.exit(f"Unknown app '{wanted}'. Known apps: {', '.join(known)}")
          else:
              before = os.environ.get("BEFORE", "")
              diff = subprocess.run(["git", "diff", "--name-only", before, "HEAD"], capture_output=True, text=True)
              if not before.strip("0") or diff.returncode != 0:
                  apps = known  # new branch or unknown base: build everything
              else:
                  changed = diff.stdout.split()
                  if any(p.startswith(("tools/", ".github/")) for p in changed):
                      apps = known
                  else:
                      # A changed file belongs to the app whose folder contains it.
                      apps = {a for a in known if any(p.startswith(f"apps/{a}/") for p in changed)}
                      # Rebuild apps that depend on a changed app, since their artifact name
                      # includes its version.
                      apps |= {a for a in known if build.load_manifest(a).get("dependsOn") in apps}
                      apps = sorted(apps)
          print("Apps to build:", apps or "none")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"apps={json.dumps(apps)}\n")
          EOF

  build:
    needs: check
    if: needs.check.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # for the release step
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.check.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install cryptography

      # Downloads the installers, stops on any SHA-256 mismatch, builds and verifies the package.
      - name: Build ${{ matrix.app }}
        run: python tools/build.py "${{ matrix.app }}"

      - name: Summary
        id: summary
        run: |
          version=$(python -c "import json; print(json.load(open('apps/${{ matrix.app }}/app.json'))['version'])")
          pkg=$(ls out/${{ matrix.app }}/*.intunewin)
          # <Product>-<version>, plus _<Product>-<version> of the app it depends on (tools/build.py).
          artifact=$(python -c "import sys; sys.path.insert(0, 'tools'); import build; app = '${{ matrix.app }}'; print(build.artifact_name(app, build.load_manifest(app)))")
          release=$(python -c "import json; print(str(json.load(open('apps/${{ matrix.app }}/app.json')).get('release', False)).lower())")
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "package=$pkg" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ matrix.app }} $version"
            echo "- Package: \`$(basename "$pkg")\`, $(stat -c %s "$pkg") bytes"
            echo "- SHA-256: \`$(sha256sum "$pkg" | cut -d' ' -f1)\`"
            echo "- Download the **$artifact** artifact below: the .intunewin with its detection script and Intune settings. GitHub delivers it as a .zip; extract it, then upload the .intunewin to Intune."
          } >> "$GITHUB_STEP_SUMMARY"

      # The whole out/<app>/ folder: the .intunewin, Detect.ps1 (if any) and Intune settings.txt.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.summary.outputs.artifact }}
          path: out/${{ matrix.app }}/
          # Packages are encrypted, so compressing them again gains nothing.
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      # A public, permanent download, named like the artifact (e.g. Python-3.15.2), holding the
      # .intunewin and <artifact>.zip (the whole out/<app>/ bundle). Only on main, and only for apps
      # whose installer may be redistributed ("release": true). An existing release keeps its
      # .intunewin (rebuilding re-encrypts it), but its bundle is rebuilt around that published copy
      # every time, so changes to the settings, detection script or logo reach the download.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && steps.summary.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.summary.outputs.artifact }}
          PKG: ${{ steps.summary.outputs.package }}
          APP: ${{ matrix.app }}
        run: |
          file=$(basename "$PKG")
          bundle="$RUNNER_TEMP/$TAG.zip"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            if grep -qxF "$file" <<<"$assets"; then
              echo "Release $TAG already has $file; bundling that copy."
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$file" --dir "$(dirname "$PKG")" --clobber
            else
              gh release upload "$TAG" "$PKG" --repo "$GITHUB_REPOSITORY"
            fi
            (cd "out/$APP" && zip -q -r "$bundle" .)
            gh release upload "$TAG" "$bundle" --repo "$GITHUB_REPOSITORY" --clobber
          else
            (cd "out/$APP" && zip -q -r "$bundle" .)
            notes="Intune package for \`$APP\`: \`$file\`, SHA-256 \`$(sha256sum "$PKG" | cut -d' ' -f1)\`.
          $TAG.zip has the .intunewin with its detection script (if any), Intune logo and settings. Details: https://github.com/$GITHUB_REPOSITORY/blob/main/apps/$APP/README.md"
            gh release create "$TAG" "$PKG" "$bundle" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" --notes "$notes" --latest=false
          fi
          echo "- Published in the [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG) release." >> "$GITHUB_STEP_SUMMARY"

  # The GitHub Pages site: every app's download, Intune settings and detection, from main.
  # Runs after the builds (or when none were needed), so it links to this run's packages.
  site:
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # to list CI artifacts
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the site lists apps newest first, by when their version was committed

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: List releases and CI builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | tojson' > "$RUNNER_TEMP/releases.jsonl"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" --paginate --jq '.artifacts[] | tojson' > "$RUNNER_TEMP/artifacts.jsonl"

      - name: Build site
        run: python site/build.py --releases "$RUNNER_TEMP/releases.jsonl" --artifacts "$RUNNER_TEMP/artifacts.jsonl" --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
