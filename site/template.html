<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intune App Packages</title>
<meta name="description" content="Intune Win32 packages built from this repo: downloads, install and uninstall commands, and detection rules.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>document.documentElement.classList.add('js');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Green neon / Tron / vaporwave. Always dark: the look depends on it. */
  :root {
    --bg: #03070a; --bg-2: #061014; --panel: rgba(6, 22, 18, 0.78); --panel-solid: #071a15;
    --text: #d7f7e8; --muted: #84b8a2; --line: rgba(57, 255, 136, 0.22); --line-strong: rgba(57, 255, 136, 0.55);
    --neon: #39ff88; --neon-2: #00f0d0; --neon-dim: #1f9e5c; --on-neon: #02130a;
    --code-bg: #020a07; --warn: #ffc24b; --warn-bg: rgba(255, 194, 75, 0.08);
    --glow: 0 0 6px rgba(57, 255, 136, 0.55), 0 0 18px rgba(57, 255, 136, 0.25);
    --cut: 14px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--text); background: var(--bg);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background-image:
      linear-gradient(rgba(57, 255, 136, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(57, 255, 136, 0.035) 1px, transparent 1px);
    background-size: 44px 44px; background-attachment: fixed;
  }
  /* Full width, with side padding that grows with the screen (16px on phones, 64px on wide ones). */
  main, footer, .header-inner { margin: 0 auto; padding: 0 clamp(16px, 3vw, 64px); }
  a { color: var(--neon-2); text-underline-offset: 3px; }
  a:hover { color: var(--neon); }
  code, pre { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: 13px; }
  code { background: var(--code-bg); color: #b9ffd9; padding: 1px 6px; border: 1px solid var(--line);
    border-radius: 3px; overflow-wrap: anywhere; }
  ::selection { background: var(--neon); color: var(--on-neon); }

  /* --- Header: title, then a horizon strip with a vaporwave sun rising behind a Tron grid -- */
  header { position: relative; overflow: hidden; padding: 56px 0 0;
    background: linear-gradient(#02060a, #04120e 75%, #062018); border-bottom: 1px solid var(--line-strong);
    box-shadow: 0 1px 24px rgba(57, 255, 136, 0.25); }
  .horizon { position: relative; height: 190px; margin-top: 24px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 72%, rgba(0, 240, 208, 0.22), transparent 55%); }
  .sun { position: absolute; left: 50%; bottom: -40px; width: 220px; height: 220px; transform: translateX(-50%);
    border-radius: 50%; background: linear-gradient(180deg, #d8ff6a 0%, var(--neon) 45%, var(--neon-2) 100%);
    -webkit-mask: linear-gradient(#000 40%, transparent 40% 43%, #000 43% 50%, transparent 50% 54%, #000 54% 60%,
      transparent 60% 65%, #000 65% 70%, transparent 70% 76%, #000 76%);
            mask: linear-gradient(#000 40%, transparent 40% 43%, #000 43% 50%, transparent 50% 54%, #000 54% 60%,
      transparent 60% 65%, #000 65% 70%, transparent 70% 76%, #000 76%);
    filter: drop-shadow(0 0 28px rgba(57, 255, 136, 0.55)); opacity: 0.9; }
  .floor { position: absolute; left: -50%; right: -50%; bottom: 0; height: 64px;
    background-color: #041a12;
    background-image:
      linear-gradient(var(--neon) 1.5px, transparent 1.5px),
      linear-gradient(90deg, var(--neon) 1.5px, transparent 1.5px);
    background-size: 56px 22px; transform: perspective(180px) rotateX(58deg); transform-origin: 50% 100%;
    box-shadow: 0 -2px 18px rgba(57, 255, 136, 0.65); animation: drive 2.4s linear infinite; }
  .floor::before { content: ""; position: absolute; inset: 0;
    background: linear-gradient(rgba(4, 26, 18, 0.9), transparent 70%); }
  @keyframes drive { to { background-position: 0 22px, 0 0; } }
  @media (prefers-reduced-motion: reduce) { .floor { animation: none; } }
  .header-inner { position: relative; z-index: 1; }
  .kicker { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: 0.3em; color: var(--neon-2);
    text-transform: uppercase; margin: 0 0 10px; }
  h1 { font-family: Orbitron, system-ui, sans-serif; font-weight: 900; font-size: clamp(30px, 6vw, 52px);
    line-height: 1.05; margin: 0; letter-spacing: 0.04em; text-transform: uppercase; color: #eafff4;
    text-shadow: 0 0 8px rgba(57, 255, 136, 0.9), 0 0 28px rgba(57, 255, 136, 0.45); }

  /* --- Index of apps --------------------------------------------------------------------- */
  /* Every card the same size: equal columns that stretch to fill the row (auto-fit), and every
     row as tall as the tallest card. */
  .index { list-style: none; padding: 0; margin: 28px 0 8px; display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); grid-auto-rows: 1fr; }
  .index li { display: flex; }
  .index .card { flex: 1; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-content: center;
    align-items: center; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line);
    font: inherit; color: var(--text); text-align: left; cursor: pointer;
    clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut)));
    transition: border-color .15s, box-shadow .15s, background .15s; }
  .index .card:hover { border-color: var(--neon); box-shadow: var(--glow) inset; background: rgba(10, 40, 30, 0.85); }
  .index .card:focus-visible { outline: 2px solid var(--neon-2); outline-offset: 2px; }
  .index .card[aria-pressed="true"] { border-color: var(--neon); background: rgba(57, 255, 136, 0.13);
    box-shadow: var(--glow) inset; }
  .index .card[aria-pressed="true"] .tag { background: var(--neon); color: var(--on-neon); }
  .index .card.with-logo { grid-template-columns: auto 1fr auto; }
  .index .logo { grid-row: span 2; }
  .index .name { font-weight: 600; }
  .index .artifact { grid-column: 1 / -1; color: var(--muted); font-size: 12px; font-family: "JetBrains Mono", monospace;
    overflow-wrap: anywhere; }
  .index .card.with-logo .artifact { grid-column: 2 / -1; }
  .tag { font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--neon); border: 1px solid var(--line-strong); padding: 0 8px; }
  img.logo { width: 36px; height: 36px; object-fit: contain; }
  .app-title { display: flex; gap: 14px; align-items: center; }
  .app-title img.logo { width: 44px; height: 44px; filter: drop-shadow(0 0 8px rgba(57, 255, 136, 0.35)); }

  /* --- App sections ------------------------------------------------------------------------ */
  /* Sections stay hidden until their card is selected; two or more sit side by side. */
  .js .app:not(.shown) { display: none; }
  .apps.compare { display: grid; gap: 20px; align-items: start; margin-top: 26px;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); }
  .apps.compare .app { margin: 0; }
  .app { position: relative; background: var(--panel); border: 1px solid var(--line-strong);
    padding: 22px 24px; margin: 26px 0; scroll-margin-top: 16px; min-width: 0;
    clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
    box-shadow: 0 0 0 1px rgba(57, 255, 136, 0.06) inset, 0 0 30px rgba(57, 255, 136, 0.08) inset; }
  .app::before { content: ""; position: absolute; left: 0; top: 0; width: 140px; height: 2px;
    background: linear-gradient(90deg, var(--neon), transparent); box-shadow: var(--glow); }
  .app h2 { margin: 0; font-family: Orbitron, system-ui, sans-serif; font-weight: 700; font-size: 21px;
    letter-spacing: 0.03em; color: #eafff4; text-shadow: 0 0 10px rgba(57, 255, 136, 0.45); }
  .app h3 { font-family: Orbitron, system-ui, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--neon); margin: 26px 0 10px; }
  .meta { margin: 6px 0 16px; color: var(--muted); font-size: 14px; }
  .note { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  .missing { margin: 0; padding: 10px 12px; background: var(--warn-bg); color: var(--warn);
    border: 1px solid rgba(255, 194, 75, 0.35); }
  .size { color: var(--muted); font-size: 13px; margin-left: 8px; font-family: "JetBrains Mono", monospace; }
  .more { margin: 20px 0 0; font-size: 14px; }
  .bundle { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  .contents { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .contents li { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--text);
    border: 1px solid var(--line); background: var(--code-bg); padding: 2px 8px; }

  .button, .select { font: inherit; font-size: 14px; cursor: pointer; }
  .button { display: inline-block; padding: 9px 18px; background: var(--neon); color: var(--on-neon);
    text-decoration: none; font-weight: 700; border: 1px solid var(--neon); letter-spacing: 0.02em;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    box-shadow: var(--glow); transition: filter .15s; }
  .button:hover { color: var(--on-neon); filter: brightness(1.15) drop-shadow(0 0 10px rgba(57, 255, 136, 0.7)); }
  .button.secondary { background: transparent; color: var(--neon); box-shadow: none; }
  .button.secondary:hover { background: rgba(57, 255, 136, 0.1); color: var(--neon); }
  .select { padding: 4px 12px; background: transparent; color: var(--neon); border: 1px solid var(--line-strong);
    white-space: nowrap; font-family: "JetBrains Mono", monospace; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.06em; }
  .select:hover { border-color: var(--neon); box-shadow: var(--glow); }
  .select.done { background: var(--neon); color: var(--on-neon); border-color: var(--neon); }
  .selectable { user-select: all; -webkit-user-select: all; cursor: text; }

  table.settings { width: 100%; border-collapse: collapse; font-size: 14px; }
  .settings th, .settings td { text-align: left; vertical-align: top; padding: 9px 10px;
    border-top: 1px solid var(--line); }
  .settings th { font-weight: 500; color: var(--muted); width: 30%; }
  .settings strong { color: #eafff4; }
  .copyable { display: flex; gap: 8px; align-items: flex-start; }
  .copyable code { flex: 1; display: block; padding: 7px 9px; }

  .script-actions { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  pre { margin: 0; padding: 14px 16px; background: var(--code-bg); border: 1px solid var(--line);
    border-left: 2px solid var(--neon); overflow-x: auto; max-height: 420px; color: #b9ffd9; }
  pre code { background: none; padding: 0; border: 0; }

  footer { color: var(--muted); font-size: 13px; padding-top: 10px; padding-bottom: 48px; }

  @media (max-width: 600px) {
    header { padding-top: 40px; }
    .horizon { height: 160px; }
    .sun { width: 180px; height: 180px; bottom: -30px; }
    .app { padding: 18px 16px; }
    .settings th, .settings td { display: block; width: 100%; padding-left: 0; padding-right: 0; }
    .settings th { padding-bottom: 0; border-top: 1px solid var(--line); }
    .settings td { border-top: 0; }
    .copyable { flex-direction: column; }
    .copyable code { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <p class="kicker">Win32 · Intune · Packages</p>
    <h1>Intune App Packages</h1>
  </div>
  <div class="horizon" aria-hidden="true"><div class="sun"></div><div class="floor"></div></div>
</header>
<main>
  <ul class="index">
{{index}}
  </ul>
  <div class="apps" id="apps">
{{apps}}
  </div>
</main>
<footer>
  Generated {{generated}} from <a href="{{repo_url}}">{{repo_url}}</a>.
  Release downloads are permanent; CI builds need a GitHub sign-in and expire after 14 days.
</footer>
<script>
  // Cards toggle their app's section. The page starts empty; several can be shown at once to
  // compare them. The selection is kept in the URL (#python-3-15,python-3-14) for sharing.
  (() => {
    const cards = [...document.querySelectorAll('.card')];
    const apps = document.getElementById('apps');
    const selected = new Set();
    const isApp = (id) => { const el = document.getElementById(id); return el && el.classList.contains('app'); };
    const motion = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';

    function render(reveal) {
      const ids = cards.map((c) => c.dataset.app).filter((id) => selected.has(id));
      for (const section of apps.querySelectorAll('.app')) section.classList.toggle('shown', selected.has(section.id));
      for (const card of cards) card.setAttribute('aria-pressed', String(selected.has(card.dataset.app)));
      apps.classList.toggle('compare', ids.length > 1);
      history.replaceState(null, '', ids.length ? '#' + ids.join(',') : location.pathname + location.search);
      const target = reveal && document.getElementById(reveal);
      if (target && target.getBoundingClientRect().top > innerHeight - 120) {
        target.scrollIntoView({ behavior: motion(), block: 'start' });
      }
    }

    function fromHash() {
      selected.clear();
      for (const id of decodeURIComponent(location.hash.slice(1)).split(',')) if (isApp(id)) selected.add(id);
      render();
    }

    document.addEventListener('click', (event) => {
      const card = event.target.closest('.card');
      if (card) {
        const id = card.dataset.app;
        selected.has(id) ? selected.delete(id) : selected.add(id);
        render(selected.has(id) ? id : null);
        return;
      }
      // "depends on" links inside a section add that app to the selection.
      const link = event.target.closest('a[href^="#"]');
      if (link && isApp(link.getAttribute('href').slice(1))) {
        event.preventDefault();
        const id = link.getAttribute('href').slice(1);
        selected.add(id);
        render();
        document.getElementById(id).scrollIntoView({ behavior: motion(), block: 'start' });
      }
    });
    addEventListener('hashchange', fromHash);
    fromHash();
  })();

  // Selects the command or script for the user to copy with Ctrl+C. Deliberately never writes to
  // the clipboard: a page putting PowerShell commands on the clipboard is what ClickFix attacks do.
  document.addEventListener('click', (event) => {
    const button = event.target.closest('.select');
    if (!button) return;
    const target = button.dataset.selectTarget
      ? document.getElementById(button.dataset.selectTarget)
      : button.closest('.copyable').querySelector('code');
    const range = document.createRange();
    range.selectNodeContents(target);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    button.textContent = 'Now press Ctrl+C';
    button.classList.add('done');
    clearTimeout(button.resetTimer);
    button.resetTimer = setTimeout(() => { button.textContent = 'Select'; button.classList.remove('done'); }, 2500);
  });
</script>
</body>
</html>
